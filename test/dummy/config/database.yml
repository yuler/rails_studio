# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: <%= ENV.fetch("DB_ADAPTER", "sqlite3") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

<% if ENV["DB_ADAPTER"] =~ /postgres/i %>
development:
  <<: *default
  adapter: postgresql
  database: <%= ENV.fetch("DB_NAME", "rails_studio_dummy_development") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", nil) %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>

test:
  <<: *default
  adapter: postgresql
  database: <%= ENV.fetch("DB_NAME", "rails_studio_dummy_test") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", nil) %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>
<% elsif ENV["DB_ADAPTER"] =~ /mysql/i || ENV["DB_ADAPTER"] == "trilogy" %>
development:
  <<: *default
  adapter: <%= ENV["DB_ADAPTER"] == "trilogy" ? "trilogy" : "mysql2" %>
  database: <%= ENV.fetch("DB_NAME", "rails_studio_dummy_development") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>

test:
  <<: *default
  adapter: <%= ENV["DB_ADAPTER"] == "trilogy" ? "trilogy" : "mysql2" %>
  database: <%= ENV.fetch("DB_NAME", "rails_studio_dummy_test") %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USER", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", nil) %>
<% else %>
development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3
<% end %>

production:
  <<: *default
  database: storage/production.sqlite3
