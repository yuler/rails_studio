<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="100%" height="120" fill="none">
  <defs>
    <!-- Ruby Gradients -->
    <linearGradient id="rubyGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="rubyTextLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Filters -->
    <filter id="shadowLight" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- TABLE LOGO ICON -->
  <g transform="translate(4, 0)">
    <!-- Table Container -->
    <rect x="16" y="16" width="96" height="88" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadowLight)" />

    <!-- Table Header Background -->
    <path d="M 16 30 Q 16 16 30 16 L 98 16 Q 112 16 112 30 L 112 42 L 16 42 Z" fill="#f8fafc" />

    <!-- Column Dividers -->
    <line x1="42" y1="16" x2="42" y2="104" stroke="#f1f5f9" stroke-width="1.2" />
    <line x1="76" y1="16" x2="76" y2="104" stroke="#f1f5f9" stroke-width="1.2" />

    <!-- Header Divider Line -->
    <line x1="16" y1="42" x2="112" y2="42" stroke="#e2e8f0" stroke-width="1" />

    <!-- Header Content -->
    <!-- Col 1: Primary Key Header -->
    <text x="29" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#e11d48" text-anchor="middle">#</text>
    <!-- Col 2: Name Header -->
    <rect x="48" y="26" width="20" height="5" rx="2.5" fill="#94a3b8" />
    <!-- Col 3: Relation Header -->
    <rect x="82" y="26" width="22" height="5" rx="2.5" fill="#94a3b8" />

    <!-- Row 1 -->
    <line x1="16" y1="63" x2="112" y2="63" stroke="#f1f5f9" stroke-width="1" />
    <text x="29" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">1</text>
    <rect x="47" y="49" width="22" height="6" rx="3" fill="#0284c7" fill-opacity="0.8" />
    <rect x="80" y="48" width="24" height="8" rx="4" fill="#9333ea" fill-opacity="0.12" stroke="#9333ea" stroke-width="0.8" />
    <circle cx="85" cy="52" r="1.8" fill="#9333ea" />

    <!-- Row 2 -->
    <line x1="16" y1="84" x2="112" y2="84" stroke="#f1f5f9" stroke-width="1" />
    <text x="29" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">2</text>
    <rect x="47" y="70" width="18" height="6" rx="3" fill="#0284c7" fill-opacity="0.8" />
    <rect x="80" y="69" width="24" height="8" rx="4" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="0.8" />
    <circle cx="85" cy="73" r="1.8" fill="#059669" />

    <!-- Row 3 -->
    <text x="29" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">3</text>
    <rect x="47" y="90" width="20" height="6" rx="3" fill="#d97706" fill-opacity="0.8" />
    <rect x="80" y="89" width="24" height="8" rx="4" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="0.8" />
    <circle cx="85" cy="93" r="1.8" fill="#e11d48" />

    <!-- Ruby Gem Corner Badge -->
    <g transform="translate(94, 6)">
      <polygon points="12,2 22,8 18,18 6,18 2,8" fill="url(#rubyGradLight)" stroke="#fda4af" stroke-width="0.8" />
      <line x1="6" y1="8" x2="18" y2="8" stroke="#ffe4e6" stroke-width="0.6" stroke-opacity="0.9" />
      <line x1="6" y1="8" x2="12" y2="18" stroke="#ffe4e6" stroke-width="0.6" stroke-opacity="0.9" />
      <line x1="18" y1="8" x2="12" y2="18" stroke="#ffe4e6" stroke-width="0.6" stroke-opacity="0.9" />
    </g>
  </g>

  <!-- WORDMARK & TAGLINE -->
  <g transform="translate(136, 0)">
    <!-- Brand Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0f172a">Rails</tspan>
      <tspan fill="url(#rubyTextLight)" dx="4">Studio</tspan>
    </text>

    <!-- Version / Engine Badge -->
    <rect x="226" y="32" width="62" height="22" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="257" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">v0.1.0</text>

    <!-- Subtitle -->
    <text x="1" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#64748b" letter-spacing="-0.1">
      Modern Web Database Studio for Rails
    </text>

    <!-- Inspiration Badge -->
    <g transform="translate(1, 91)">
      <rect x="0" y="0" width="292" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="0.8" />
      <circle cx="10" cy="10" r="3.5" fill="#e11d48" />
      <text x="20" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#475569">
        Inspired by <tspan font-weight="700" fill="#0f172a">Prisma Studio</tspan> &amp; <tspan font-weight="700" fill="#0f172a">Drizzle Studio</tspan>
      </text>
    </g>
  </g>
</svg>
