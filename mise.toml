[tools]
ruby = "3.4.7"
node = "26.7.0"
pnpm = "10.33.0"
uv = "latest"

[tasks.setup]
description = "Install dependencies, build assets, and setup test database"
run = """
bundle install
pnpm --dir frontend install
pnpm --dir frontend run build
cd test/dummy && bin/rails db:migrate db:seed
"""

[tasks."dev:frontend"]
description = "Watch and build frontend assets"
run = "pnpm --dir frontend run build:watch"

[tasks."dev:rails"]
description = "Start Rails test server"
run = "cd test/dummy && bin/rails server -p 3000"

[tasks.dev]
description = "Start development server and watch frontend assets"
depends = ["dev:frontend", "dev:rails"]

[tasks.build]
description = "Compile frontend assets into public/assets/"
run = "pnpm --dir frontend run build"

[tasks.test]
description = "Run automated test suite"
run = "bin/rails test"

[tasks."intro:record"]
description = "Record the README intro (Omarchy fullscreen) → assets/intro-record.mp4. SKIP_RECORD=1 to dry-run."
run = "bash .agents/skills/intro/scripts/record.sh"

[tasks."intro:encode"]
description = "Burn captions and narration onto assets/intro-record.mp4 → assets/intro.mp4"
run = "bash .agents/skills/intro/scripts/encode.sh"
