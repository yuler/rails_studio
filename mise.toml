[tools]
ruby = "3.4.7"
node = "26.7.0"
pnpm = "10.33.0"
uv = "latest"

[tasks.setup]
description = "Install dependencies, build assets, and setup test database"
run = """
bundle install
pnpm --dir frontend install
pnpm --dir frontend run build
cd test/dummy && bin/rails db:migrate db:seed
"""

[tasks."dev:frontend"]
description = "Watch and build frontend assets"
run = "pnpm --dir frontend run build:watch"

[tasks."dev:rails"]
description = "Start Rails test server"
run = "cd test/dummy && bin/rails server -p ${PORT:-3000}"

[tasks.dev]
description = "Start development server and watch frontend assets"
depends = ["dev:frontend", "dev:rails"]

[tasks."db:reset"]
description = "Drop, recreate, and reseed the dummy app database"
run = "cd test/dummy && bin/rails db:reset"

[tasks.build]
description = "Compile frontend assets into public/assets/"
run = "pnpm --dir frontend run build"

[tasks.test]
description = "Run automated test suite"
run = "bin/rails test"

[tasks."intro:seed"]
description = "Load intro demo data into the dummy app (replaces its development data)"
run = "cd test/dummy && bin/rails runner ../../video/capture/seed.rb"

[tasks."intro:capture"]
description = "Record real UI clips with headless Chrome → video/public/capture/. SCENES=sql,fk to redo some."
depends = ["intro:seed"]
run = """
pnpm --dir video install
pnpm --dir video run capture
"""

[tasks."intro:studio"]
description = "Preview the intro in Remotion Studio"
run = """
pnpm --dir video run audio
pnpm --dir video run studio
"""

[tasks."intro:render"]
description = "Synthesize music + SFX, render video/out/intro.mp4 and assets/intro-poster.jpg"
run = """
pnpm --dir video run audio
pnpm --dir video run render
pnpm --dir video run poster
"""
